[package]
name = "termdex"
version = "0.1.0"
edition = "2021"

[lib]
name = "termdex"
path = "src/lib.rs"

[[bin]]
name = "termdex"
path = "src/main.rs"
doc = false

[dependencies]
reqwest = { version = "0.12", features = ["default", "blocking", "cookies", "json", "socks"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.1", features = ["postgres"] }
serde_json = "1.0"
rand = "0.8"
colored = "2.1"
crossbeam = "0.8"
crossterm = "0.28"
ratatui = "0.28"
chrono = { version = "0.4", features = ["oldtime"] }
thiserror = "1.0"
ansi-to-tui = "7.0"
regex = "1.11"

[dev-dependencies]
httpmock = "0.8"

[dependencies.tui-input]
version = "0.8"
features = ['serde']
