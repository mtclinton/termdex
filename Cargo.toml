[package]
name = "termdex"
version = "0.1.0"
edition = "2021"

[lib]
name = "termdex"
path = "src/lib.rs"

[[bin]]
name = "termdex"
path = "src/main.rs"
doc = false

[dependencies]
reqwest = { version = "0.12.20", features = ["default", "blocking", "cookies", "json", "socks"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.0.0", features = ["postgres"] }
serde_json = "1.0"
rand = "0.9.1"
colored = "3.0.0"
crossbeam = "0.8.2"
crossterm = "0.29.0"
tui = { git = "https://github.com/ratatui/ratatui", package = "ratatui" }
chrono = "0.4.24"
thiserror = "2.0.12"
ansi-to-tui = "7.0.0"
regex = "1.9.3"

[dev-dependencies]
httpmock = "0.7.0"

[dependencies.tui-input]
version = "0.12.1"
features = ["serde"]
